[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shortest-route-ceti"
version = "0.1.0"
description = "University assignment scaffold for shortest driving routes to CETI Colomos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask",
    "osmnx",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

